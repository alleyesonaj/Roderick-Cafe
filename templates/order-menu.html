  <script>
    const customerName = localStorage.getItem('customerName') || 'Guest';
    const serviceType = localStorage.getItem('serviceType') || 'Dine-in';
    document.getElementById('orderGreeting').innerText = `Ordering for: ${customerName} (${serviceType})`;

    const cart = {};

    document.querySelectorAll('.plus-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const item = this.dataset.item;
        const price = parseInt(this.dataset.price);
        if (!cart[item]) cart[item] = { qty: 0, price: price };
        if (cart[item].qty < 10) cart[item].qty++;
        updateDisplay(item);
      });
    });

    document.querySelectorAll('.minus-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const item = this.dataset.item;
        if (!cart[item] || cart[item].qty === 0) return;
        cart[item].qty--;
        updateDisplay(item);
      });
    });

    function updateDisplay(item) {
      const span = document.getElementById('qty-' + item);
      const qty = cart[item] ? cart[item].qty : 0;
      span.textContent = qty > 0 ? qty : '';
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function getCartData() {
      return Object.entries(cart)
        .filter(([_, v]) => v.qty > 0)
        .map(([name, v]) => ({ name, qty: v.qty, price: v.price }));
    }
  </script>
