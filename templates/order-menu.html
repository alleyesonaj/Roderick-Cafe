<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Menu | Roderick Café</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Manrope:wght@700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

  <nav class="navbar">
    <h1 class="logo">Roderick Café</h1>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/menu">Menu</a>
      <a href="/about">About us</a>
    </div>
    <a href="{{ url_for('cart') }}" class="cart-link">
      <img src="{{ url_for('static', filename='images/cart-button.png') }}" alt="Cart">
    </a>
  </nav>

  <div class="navbar-line"></div>

  <main>
    <h2 class="menu-heading">Our Signature Menu</h2>

    <div id="orderGreeting" class="order-greeting-banner" style="text-align:center; margin-top:10px;"></div>

    <!-- COFFEE SECTION -->
    <div class="menu-section">
      <h3 class="menu-category-label">COFFEE</h3>
      <div class="menu-display-grid grid-4">

        <div class="menu-display-item" style="flex-direction:column; align-items:center;">
          <img src="{{ url_for('static', filename='images/ORDER_AMERICANO.png') }}" alt="Americano">
          <div class="item-details-row">
            <div class="item-text-left">
              <h3>Americano</h3>
              <div class="price">130</div>
            </div>
            <button class="add-item-btn">
              <img src="{{ url_for('static', filename='images/plus.png') }}" alt="Add">
            </button>
          </div>
        </div>

        <div class="menu-display-item" style="flex-direction:column; align-items:center;">
          <img src="{{ url_for('static', filename='images/ORDER_LATTE.png') }}" alt="Latte">
          <div class="item-details-row">
            <div class="item-text-left">
              <h3>Latte</h3>
              <div class="price">145</div>
            </div>
            <button class="add-item-btn">
              <img src="{{ url_for('static', filename='images/plus.png') }}" alt="Add">
            </button>
          </div>
        </div>

        <div class="menu-display-item" style="flex-direction:column; align-items:center;">
          <img src="{{ url_for('static', filename='images/ORDER_MACCHIATO.png') }}" alt="Macchiato">
          <div class="item-details-row">
            <div class="item-text-left">
              <h3>Macchiato</h3>
              <div class="price">150</div>
            </div>
            <button class="add-item-btn">
              <img src="{{ url_for('static', filename='images/plus.png') }}" alt="Add">
            </button>
          </div>
        </div>

        <div class="menu-display-item" style="flex-direction:column; align-items:center;">
          <img src="{{ url_for('static', filename='images/ORDER_MOCHA.png') }}" alt="Cappuccino">
          <div class="item-details-row">
            <div class="item-text-left">
              <h3>Cappuccino</h3>
              <div class="price">150</div>
            </div>
            <button class="add-item-btn">
              <img src="{{ url_for('static', filename='images/plus.png') }}" alt="Add">
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- NON-COFFEE SECTION -->
    <div class="menu-section">
      <h3 class="menu-category-label">NON-COFFEE</h3>
      <div class="menu-display-grid grid-3">

        <div class="menu-display-item" style="flex-direction:column; align-items:center;">
          <img src="{{ url_for('static', filename='images/ORDER_MATCHA.png') }}" alt="Matcha">
          <div class="item-details-row">
            <div class="item-text-left">
              <h3>Matcha</h3>
              <div class="price">130</div>
            </div>
            <button class="add-item-btn">
              <img src="{{ url_for('static', filename='images/plus.png') }}" alt="Add">
            </button>
          </div>
        </div>

        <div class="menu-display-item" style="flex-direction:column; align-items:center;">
          <img src="{{ url_for('static', filename='images/ORDER_COOKIESANDCREAM.png') }}" alt="Cookies and Cream">
          <div class="item-details-row">
            <div class="item-text-left">
              <h3>Cookies and Cream</h3>
              <div class="price">140</div>
            </div>
            <button class="add-item-btn">
              <img src="{{ url_for('static', filename='images/plus.png') }}" alt="Add">
            </button>
          </div>
        </div>

        <div class="menu-display-item" style="flex-direction:column; align-items:center;">
          <img src="{{ url_for('static', filename='images/ORDER_STRAWBERRY.png') }}" alt="Strawberry">
          <div class="item-details-row">
            <div class="item-text-left">
              <h3>Strawberry</h3>
              <div class="price">140</div>
            </div>
            <button class="add-item-btn">
              <img src="{{ url_for('static', filename='images/plus.png') }}" alt="Add">
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- PASTRIES SECTION -->
    <div class="menu-section">
      <h3 class="menu-category-label">PASTRIES</h3>
      <div class="menu-display-grid grid-4">

        <div class="menu-display-item" style="flex-direction:column; align-items:center;">
          <img src="{{ url_for('static', filename='images/ORDER_BROWNIES.png') }}" alt="Brownies">
          <div class="item-details-row">
            <div class="item-text-left">
              <h3>Brownies</h3>
              <div class="price">90</div>
            </div>
            <button class="add-item-btn">
              <img src="{{ url_for('static', filename='images/plus.png') }}" alt="Add">
            </button>
          </div>
        </div>

        <div class="menu-display-item" style="flex-direction:column; align-items:center;">
          <img src="{{ url_for('static', filename='images/ORDER_BANANA.png') }}" alt="Banana Bread">
          <div class="item-details-row">
            <div class="item-text-left">
              <h3>Banana Bread</h3>
              <div class="price">120</div>
            </div>
            <button class="add-item-btn">
              <img src="{{ url_for('static', filename='images/plus.png') }}" alt="Add">
            </button>
          </div>
        </div>

        <div class="menu-display-item" style="flex-direction:column; align-items:center;">
          <img src="{{ url_for('static', filename='images/ORDER_SMORES.png') }}" alt="S'mores">
          <div class="item-details-row">
            <div class="item-text-left">
              <h3>S'mores</h3>
              <div class="price">90</div>
            </div>
            <button class="add-item-btn">
              <img src="{{ url_for('static', filename='images/plus.png') }}" alt="Add">
            </button>
          </div>
        </div>

        <div class="menu-display-item" style="flex-direction:column; align-items:center;">
          <img src="{{ url_for('static', filename='images/ORDER_CRINKLES.png') }}" alt="Crinkles">
          <div class="item-details-row">
            <div class="item-text-left">
              <h3>Crinkles</h3>
              <div class="price">80</div>
            </div>
            <button class="add-item-btn">
              <img src="{{ url_for('static', filename='images/plus.png') }}" alt="Add">
            </button>
          </div>
        </div>

      </div>
    </div>

  </main>

  <script>
    const name = localStorage.getItem('customerName') || 'Guest';
    const type = localStorage.getItem('serviceType') || 'Dine-in';
    document.getElementById('orderGreeting').innerText = `Ordering for: ${name} (${type})`;
  </script>

</body>
</html>
