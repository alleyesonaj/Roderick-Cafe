<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Start Order | Roderick Café</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Manrope:wght@700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

  <nav class="navbar">
    <a href="/" style="text-decoration:none;">
      <h1 class="logo">Roderick Café</h1>
    </a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/menu">Menu</a>
      <a href="/about">About us</a>
    </div>
    <a href="{{ url_for('cart') }}" class="cart-link">
      <img src="{{ url_for('static', filename='images/cart-button.png') }}" alt="Cart">
    </a>
  </nav>

  <main>
    <div class="order-form-box">
      <h2 class="order-title">Welcome to Roderick Café</h2>
      <p class="order-subtitle">Please enter your details to start ordering</p>

      <div class="form-group">
        <label class="form-label-with-icon">
          <img src="{{ url_for('static', filename='images/user-form.png') }}" alt="" class="form-label-icon">
          CUSTOMER NAME
        </label>
        <input type="text" id="customerName" placeholder="Enter your name..." autocomplete="off">
      </div>

      <div class="form-group">
        <label class="form-label-with-icon">
          <img src="{{ url_for('static', filename='images/service-form.png') }}" alt="" class="form-label-icon">
          SERVICE TYPE
        </label>
        <div class="service-options">
          <label class="option-card">
            <input type="radio" name="serviceType" value="Dine-in" checked>
            <span class="option-label">DINE-IN</span>
          </label>
          <label class="option-card">
            <input type="radio" name="serviceType" value="Take-out">
            <span class="option-label">TAKE-OUT</span>
          </label>
        </div>
      </div>

      <button class="proceed-btn" id="startOrderBtn">PROCEED TO MENU</button>
    </div>
  </main>

  <script>
    document.getElementById('startOrderBtn').addEventListener('click', function() {
      var name = document.getElementById('customerName').value.trim();
      var type = document.querySelector('input[name="serviceType"]:checked').value;

      if (name === "") {
        alert("Please enter your name to proceed!");
        return;
      }

      localStorage.setItem('customerName', name);
      localStorage.setItem('serviceType', type);

      window.location.href = "{{ url_for('order_menu') }}";
    });
  </script>

</body>
</html>
