<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | Roderick Café</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Manrope:wght@700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

  <nav class="navbar navbar--login">
    <a href="/" style="text-decoration:none;">
      <h1 class="logo">Roderick Café</h1>
    </a>
  </nav>

  <main>
    <div class="order-form-box">
      <h2 class="order-title">Admin Login</h2>
      <p class="order-subtitle">Enter your credentials to access the admin panel</p>

      {% if error %}
        <p style="
          font-family: 'Unbounded', sans-serif;
          font-size: 12px;
          color: #C0392B;
          font-weight: 700;
          text-align: center;
          margin-bottom: 16px;
        ">{{ error }}</p>
      {% endif %}

      <form method="POST" action="{{ url_for('admin_login') }}">

        <div class="form-group">
          <label class="form-label-with-icon">
            USERNAME
          </label>
          <input
            type="text"
            name="username"
            placeholder="Enter admin username"
            autocomplete="off"
            value="{{ request.form.get('username', '') }}"
          >
        </div>

        <div class="form-group">
          <label class="form-label-with-icon">
            PASSWORD
          </label>
          <input
            type="password"
            name="password"
            placeholder="Enter admin password"
            autocomplete="off"
          >
        </div>

        <button type="submit" class="proceed-btn">LOGIN</button>

      </form>
    </div>
  </main>

</body>
</html>
