<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu | Roderick Café</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Manrope:wght@700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

  <nav class="navbar">
    <h1 class="logo">Roderick Café</h1>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/menu">Menu</a>
      <a href="/about">About us</a>
    </div>
    <a href="{{ url_for('cart') }}" class="cart-link">
      <img src="{{ url_for('static', filename='images/cart-button.png') }}" alt="Cart">
    </a>
  </nav>

  <main>
    <h2 class="menu-heading">Our Signature Menu</h2>

    <!-- COFFEE SECTION -->
    <div class="menu-section">
      <h3 class="menu-category-label">COFFEE</h3>
      <div class="menu-display-grid grid-4">
        <div class="menu-display-item">
          <img src="{{ url_for('static', filename='images/MENU_AMERICANO.png') }}" alt="Americano">
        </div>
        <div class="menu-display-item">
          <img src="{{ url_for('static', filename='images/MENU_LATTE.png') }}" alt="Latte">
        </div>
        <div class="menu-display-item">
          <img src="{{ url_for('static', filename='images/MENU_MACCHIATO.png') }}" alt="Macchiato">
        </div>
        <div class="menu-display-item">
          <img src="{{ url_for('static', filename='images/MENU_MOCHA.png') }}" alt="Mocha">
        </div>
      </div>
    </div>

    <!-- NON-COFFEE SECTION -->
    <div class="menu-section">
      <h3 class="menu-category-label">NON-COFFEE</h3>
      <div class="menu-display-grid grid-3">
        <div class="menu-display-item">
          <img src="{{ url_for('static', filename='images/MENU_MATCHA.png') }}" alt="Matcha">
        </div>
        <div class="menu-display-item">
          <img src="{{ url_for('static', filename='images/MENU_STRAWBERRY.png') }}" alt="Strawberry Iced Tea">
        </div>
        <div class="menu-display-item">
          <img src="{{ url_for('static', filename='images/MENU_COOKIESANDCREAM.png') }}" alt="Cookies and Cream">
        </div>
      </div>
    </div>

    <!-- PASTRIES SECTION -->
    <div class="menu-section">
      <h3 class="menu-category-label">PASTRIES</h3>
      <div class="menu-display-grid grid-4">
        <div class="menu-display-item">
          <img src="{{ url_for('static', filename='images/MENU_BROWNIES.png') }}" alt="Brownies">
        </div>
        <div class="menu-display-item">
          <img src="{{ url_for('static', filename='images/MENU_BANANA.png') }}" alt="Banana">
        </div>
        <div class="menu-display-item">
          <img src="{{ url_for('static', filename='images/MENU_SMORES.png') }}" alt="S'mores">
        </div>
        <div class="menu-display-item">
          <img src="{{ url_for('static', filename='images/MENU_CRINKLES.png') }}" alt="Crinkles">
        </div>
      </div>
    </div>

  </main>

  <footer>
    <div class="footer-top">
      <div class="footer-left">
        Aviles, Armi Jhon A.<br>
        Igloso, Mark Jacob S.<br>
        Orfella Jr, Roderick Roxas
      </div>
      <div class="footer-right">
        SPONSORED BY BAKE ME, BEBU
      </div>
    </div>

    <div class="footer-line"></div>

    <div class="footer-bottom">
      <div class="social-icons">
        <img src="{{ url_for('static', filename='images/facebook.png') }}" alt="Facebook">
        <img src="{{ url_for('static', filename='images/instagram.png') }}" alt="Instagram">
        <img src="{{ url_for('static', filename='images/tiktok.png') }}" alt="TikTok">
        <img src="{{ url_for('static', filename='images/twitter.png') }}" alt="Twitter">
        <img src="{{ url_for('static', filename='images/linkedin.png') }}" alt="LinkedIn">
      </div>
      <div class="copyright">
        © Roderick Café Ordering System. All rights reserved.
      </div>
    </div>
  </footer>

</body>
</html>
