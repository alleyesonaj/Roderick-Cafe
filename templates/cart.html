<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | Roderick Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Manrope:wght@700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

  <nav class="navbar">
    <h1 class="logo">Roderick Café</h1>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/menu">Menu</a>
      <a href="/about">About us</a>
    </div>
    <a href="{{ url_for('cart') }}" class="cart-link">
      <img src="{{ url_for('static', filename='images/cart-button.png') }}" alt="Cart">
    </a>
  </nav>

  <main style="max-width:1100px; margin:0 auto; padding:20px 40px 60px;">

    <h2 class="cart-title">Your Cart</h2>

    <div class="cart-layout">

      
      <div class="cart-items" id="cartItems">
        <p class="cart-empty">No items in cart yet.</p>
      </div>

      
      <div class="cart-sidebar">

        <div class="cart-summary">
          <div class="summary-row">
            <span>Total Quantity</span>
            <span id="totalQty">0</span>
          </div>
          <div class="summary-divider"></div>
          <div class="summary-row summary-total">
            <span>Total Amount</span>
            <span id="totalAmount">₱0</span>
          </div>
        </div>

        <div class="payment-label">Payment Method</div>
        <div class="payment-options">
          <button class="payment-btn" id="cashPaymentBtn">
            <img src="{{ url_for('static', filename='images/cash-payment-button.png') }}" alt="Cash Payment">
          </button>
          <button class="payment-btn" id="cardPaymentBtn">
            <img src="{{ url_for('static', filename='images/card-payment-button.png') }}" alt="Card Payment">
          </button>
        </div>

        <a href="{{ url_for('receipt') }}" style="display:block; margin-top:16px;">
          <button class="payment-btn order-now-btn">
            <img src="{{ url_for('static', filename='images/order-button.png') }}" alt="Order">
          </button>
        </a>

      </div>
    </div>
  </main>

  <footer>
    <div class="footer-top">
      <div class="footer-left">
        Aviles, Armi Jhon A.<br>
        Igloso, Mark Jacob S.<br>
        Orfella Jr, Roderick Roxas
      </div>
      <div class="footer-right">
        SPONSORED BY BAKE ME, BEBU
      </div>
    </div>
    <div class="footer-line"></div>
    <div class="footer-bottom">
      <div class="social-icons">
        <img src="{{ url_for('static', filename='images/facebook.png') }}" alt="Facebook">
        <img src="{{ url_for('static', filename='images/instagram.png') }}" alt="Instagram">
        <img src="{{ url_for('static', filename='images/tiktok.png') }}" alt="TikTok">
        <img src="{{ url_for('static', filename='images/twitter.png') }}" alt="Twitter">
        <img src="{{ url_for('static', filename='images/linkedin.png') }}" alt="LinkedIn">
      </div>
      <div class="copyright">
        © Roderick Café Ordering System. All rights reserved.
      </div>
    </div>
  </footer>

  <script>
    const cart = JSON.parse(localStorage.getItem('cart') || '{}');

    const container = document.getElementById('cartItems');
    const totalQtyEl = document.getElementById('totalQty');
    const totalAmountEl = document.getElementById('totalAmount');

    const items = Object.entries(cart).filter(([_, v]) => v.qty > 0);

    if (items.length === 0) {
      container.innerHTML = '<p class="cart-empty">No items in cart yet.</p>';
    } else {
      container.innerHTML = '';
      let totalQty = 0;
      let totalAmount = 0;

      items.forEach(([name, v]) => {
        totalQty += v.qty;
        totalAmount += v.qty * v.price;

        const row = document.createElement('div');
        row.className = 'cart-row';
        row.innerHTML = `
          <div class="cart-row-info">
            <div class="cart-row-name">${name}</div>
            <div class="cart-row-meta">
              <span class="cart-qty">${v.qty}x</span>
              <span class="cart-price">₱${v.price * v.qty}</span>
            </div>
          </div>
          <textarea class="cart-customize" placeholder="Add customization notes..."></textarea>
        `;
        container.appendChild(row);
      });

      totalQtyEl.textContent = totalQty;
      totalAmountEl.textContent = '₱' + totalAmount;
    }

    document.getElementById('cashPaymentBtn').addEventListener('click', function() {
      // handle cash payment
    });

    document.getElementById('cardPaymentBtn').addEventListener('click', function() {
      // handle card payment
    });
  </script>

</body>
</html>
