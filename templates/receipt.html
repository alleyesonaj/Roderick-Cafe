<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Receipt | Roderick Café</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Manrope:wght@700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

  <nav class="navbar">
    <a href="/" style="text-decoration:none;">
      <h1 class="logo">Roderick Café</h1>
    </a>
  </nav>

  <main class="main-content">
    <div class="receipt-wrapper">
      <img class="receipt-bg" src="{{ url_for('static', filename='images/receipt.png') }}" alt="Receipt">

      <div class="receipt-content">
        <div class="field-order-id">RECEIPT #: <span id="receiptId"></span></div>
        <div class="field-customer">CUSTOMER: <span id="receiptCustomer"></span></div>
        <div class="field-service">SERVICE TYPE: <span id="receiptService"></span></div>

        <div class="field-dynamic-items-list" id="receiptItems"></div>

        <div class="field-total-cost-amount" id="receiptTotal"></div>
        <div class="field-payment-type-method" id="receiptPayment"></div>
      </div>
    </div>

    <div class="receipt-actions">
      <button class="new-order-btn" id="newOrderBtn">NEW ORDER</button>
      <p class="countdown-text">Redirecting in <span id="countdownNum">15</span> seconds...</p>
    </div>
  </main>

  <script>
    const orderId = localStorage.getItem('orderId');

    function clearAndRedirect() {
      localStorage.removeItem('customerName');
      localStorage.removeItem('serviceType');
      localStorage.removeItem('cart');
      localStorage.removeItem('paymentMethod');
      localStorage.removeItem('orderId');
      localStorage.removeItem('totalAmount');
      window.location.href = '/order';
    }

    document.getElementById('newOrderBtn').addEventListener('click', clearAndRedirect);

    let seconds = 15;
    const countdownEl = document.getElementById('countdownNum');
    const timer = setInterval(function() {
      seconds--;
      countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        clearAndRedirect();
      }
    }, 1000);

    if (!orderId) {
      document.getElementById('receiptId').textContent = '--';
      document.getElementById('receiptCustomer').textContent = '--';
      document.getElementById('receiptService').textContent = '--';
      document.getElementById('receiptTotal').textContent = '--';
      document.getElementById('receiptPayment').textContent = '--';
    } else {
      document.getElementById('receiptId').textContent = orderId;

      fetch(`/api/get-receipt/${orderId}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success' && data.receipt.length > 0) {
            const first = data.receipt[0];

            document.getElementById('receiptCustomer').textContent = first.customerName;
            document.getElementById('receiptService').textContent = first.serviceType;
            document.getElementById('receiptTotal').textContent = '₱' + parseFloat(first.totalAmount).toFixed(2);
            document.getElementById('receiptPayment').textContent = first.paymentOption;

            const itemsContainer = document.getElementById('receiptItems');
            data.receipt.forEach(row => {
              const div = document.createElement('div');
              div.style.display = 'flex';
              div.style.justifyContent = 'space-between';
              div.style.marginBottom = '4px';
              div.style.fontWeight = 'bold';
              div.style.fontSize = '12px';
              const customization = row.customization ? ` (${row.customization})` : '';
              div.innerHTML = `
                <span>${row.quantity}x ${row.itemName}${customization}</span>
                <span>₱${(row.quantity * parseFloat(row.price)).toFixed(2)}</span>
              `;
              itemsContainer.appendChild(div);
            });

          } else {
            document.getElementById('receiptCustomer').textContent = '--';
            document.getElementById('receiptService').textContent = '--';
            document.getElementById('receiptTotal').textContent = '--';
            document.getElementById('receiptPayment').textContent = '--';
          }
        })
        .catch(err => {
          console.error('Failed to fetch receipt:', err);
        });
    }
  </script>

</body>
</html>
